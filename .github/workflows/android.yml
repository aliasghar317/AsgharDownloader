name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Install Android SDK with the exact build-tools version pinned in
    # gradle.properties (android.aapt2FromMavenOverride points there).
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-34 build-tools;36.0.0

    # gradle.properties hard-codes /opt/android-sdk/build-tools/36.0.0/aapt2 so
    # the same path works on every machine. On the GitHub-hosted runner the SDK
    # lives at /usr/local/lib/android/sdk, so expose it under /opt/android-sdk
    # for the build (and aapt2 will be picked up by the AarResourcesCompilerTransform).
    - name: Symlink Android SDK to /opt/android-sdk
      run: |
        if [ ! -e /opt/android-sdk ]; then
          sudo mkdir -p /opt
          sudo ln -s "$ANDROID_SDK_ROOT" /opt/android-sdk
        fi
        ls -l /opt/android-sdk/build-tools/36.0.0/aapt2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
