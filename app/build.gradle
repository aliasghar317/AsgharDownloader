plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Download the latest stable yt-dlp source from GitHub releases and stage it under
// app/src/main/assets/yt-dlp/. The asset is packaged into the APK and copied to the
// app's internal storage on first launch. This replaces the in-app network updater:
// the bundled binary is always the freshest stable release at build time.
def ytDlpAssetDir = file("${projectDir}/src/main/assets/yt-dlp")
def ytDlpAssetFile = file("${ytDlpAssetDir}/yt-dlp")

task downloadLatestYtDlp {
    description = 'Fetch the latest stable yt-dlp and place it in assets for bundling.'
    outputs.file ytDlpAssetFile
    doLast {
        ytDlpAssetDir.mkdirs()
        def url = 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp'
        logger.lifecycle("Downloading latest yt-dlp from ${url}")
        def bytes = url.toURL().bytes
        ytDlpAssetFile.bytes = bytes
        ytDlpAssetFile.setExecutable(true, false)
        if (!ytDlpAssetFile.exists() || ytDlpAssetFile.length() == 0) {
            throw new GradleException("yt-dlp download failed: ${ytDlpAssetFile}")
        }
        logger.lifecycle("yt-dlp staged: ${ytDlpAssetFile} (${ytDlpAssetFile.length()} bytes)")
    }
}

// Hook into preBuild so the asset exists before resources are packaged.
tasks.named('preBuild').configure { dependsOn downloadLatestYtDlp }

android {
    namespace 'com.asghar.downloader'
    compileSdk 34

    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId "com.asghar.downloader"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    // Latest published youtubedl-android release. The bundled yt-dlp from Maven is
    // months out of date; we override it with the freshest release at build time
    // (see the downloadLatestYtDlp task above).
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}