org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Use aapt2 from build-tools 36.0.0 (which is x86_64 on CI natively and wrapped
# in qemu-x86_64 on aarch64 dev hosts). The CI workflow installs build-tools
# 36.0.0 and exposes the SDK at /opt/android-sdk (via a symlink to the real
# install location) so this absolute path is identical on every machine.
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2
android.enableResourceOptimizations=false
