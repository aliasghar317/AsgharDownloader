org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Use the host-compatible aapt2 from the Android SDK build-tools instead of
# AGP's bundled x86_64 binary (which crashes on aarch64). The build-tools
# version is intentionally pinned to 36.0.0; the GitHub Actions workflow
# installs it explicitly so the same path works on CI runners too.
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2
android.enableResourceOptimizations=false
